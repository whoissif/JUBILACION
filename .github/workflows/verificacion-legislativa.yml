name: Verificación legislativa

on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 1 * *'   # día 1 de cada mes: detecta revisión caducada / año sin parámetros
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run verificar
